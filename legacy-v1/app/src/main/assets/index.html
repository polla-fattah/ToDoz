<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="color-scheme" content="light dark"><title>TaskFlow</title><style>
:root{--bg:#faf9f6;--panel:#fff;--text:#282824;--muted:#85847e;--line:#eeece7;--red:#cf5147;--soft:#fae9e5;--shadow:0 16px 70px #0002}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}body.dark{--bg:#1d1e20;--panel:#252629;--text:#f0efea;--muted:#a3a29c;--line:#393a3e;--soft:#472e2b;--shadow:0 16px 70px #0007}button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none;border-radius:10px;padding:11px}button:active{opacity:.65}button:focus-visible{outline:2px solid var(--red)}input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--red)}textarea{resize:vertical;min-height:85px}header{padding:22px 20px 12px;display:flex;align-items:center;gap:12px}header h2{margin:0;font-size:19px;flex:1;letter-spacing:-.6px}.logo{background:var(--red);color:white;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.icon{font-size:21px;padding:8px;min-width:40px}.hero{padding:25px 24px 16px}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:700;color:var(--red);text-transform:uppercase}h1{font-size:34px;letter-spacing:-1.3px;margin:7px 0}p{line-height:1.6}.progress{background:var(--line);height:5px;border-radius:9px;margin-top:15px;overflow:hidden}.progress span{height:100%;background:var(--red);display:block}.toolbar{display:flex;gap:7px;padding:8px 24px 18px;overflow:auto}.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);font-size:12px;padding:8px 13px}.chip.on{background:var(--soft);color:var(--red);border-color:transparent}main{max-width:900px;margin:auto;padding-bottom:155px}.group{padding:10px 24px}.group h3{font-size:13px;padding-bottom:12px;border-bottom:1px solid var(--line);margin:8px 0 0}.task{display:flex;align-items:flex-start;gap:12px;padding:17px 0;border-bottom:1px solid var(--line)}.check{width:23px;height:23px;min-width:23px;border:1.7px solid var(--muted);border-radius:50%;padding:0;margin-top:1px}.check.done{background:var(--red);border-color:var(--red);color:#fff}.taskbody{flex:1;min-width:0;cursor:pointer}.title{line-height:1.5;overflow-wrap:anywhere}.completed{text-decoration:line-through;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;margin-top:7px;color:var(--muted)}.overdue{color:var(--red)}.tag{color:#8d75b4}.empty{text-align:center;padding:65px 25px}.empty .big{font-size:48px;color:var(--red)}.fab{position:fixed;bottom:93px;right:23px;background:var(--red);color:white;border-radius:18px;box-shadow:0 5px 22px #cf514740;font-size:30px;width:58px;height:58px;padding:0;z-index:4}nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 5px 14px;z-index:4}nav button{font-size:10px;min-width:65px;color:var(--muted)}nav b{display:block;font-size:21px;margin-bottom:3px}nav .active{color:var(--red);background:var(--soft)}.overlay{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:650px;max-height:92dvh;overflow:auto;padding:22px 23px 30px;box-shadow:var(--shadow)}.sheet h2{margin:0;font-size:22px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.field{display:block;margin:15px 0 6px;font-size:12px;font-weight:600;color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.primary{background:var(--red);color:white;font-weight:600}.wide{width:100%;margin-top:22px}.danger{color:var(--red)}.listbutton{display:flex;align-items:center;width:100%;text-align:left;padding:15px 12px;border-bottom:1px solid var(--line);gap:12px}.listbutton span:nth-child(2){flex:1}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.notice{position:fixed;bottom:165px;left:20px;right:20px;background:var(--text);color:var(--bg);padding:14px;border-radius:12px;z-index:30;max-width:600px;margin:auto;box-shadow:var(--shadow)}.notice button{color:inherit;float:right;padding:0 5px;font-weight:700}.board{display:flex;overflow:auto;padding:10px 20px;gap:15px}.column{background:var(--panel);min-width:260px;flex:1;padding:16px;border-radius:16px}.column .task{font-size:14px}.search{margin:0 24px 15px}.subrow{display:flex;gap:10px;align-items:center;margin:9px 0}.subrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}.subrow span{flex:1}.comment{background:var(--panel);padding:13px;border-radius:10px;margin:10px 0;font-size:13px}.comment time{display:block;color:var(--muted);font-size:10px;margin-top:7px}.stat{padding:20px;background:var(--panel);border-radius:15px;flex:1}.stat strong{display:block;font-size:27px}.help{font-size:12px;line-height:1.6;color:var(--muted)}.sectionname{font-size:12px;margin-top:20px} @media(min-width:750px){.hero,header{max-width:900px;margin:auto}.sheet{border-radius:24px;margin-bottom:35px}.overlay{align-items:center}nav{left:calc(50% - 350px);right:calc(50% - 350px);border-radius:20px 20px 0 0}.fab{right:calc(50% - 420px)}}
</style></head><body><header><div class="logo">✓</div><h2>TaskFlow</h2><button class="icon" onclick="searchView()" aria-label="Search">⌕</button><button class="icon" onclick="settings()" aria-label="Settings">⚙</button></header><div id="app"></div><button class="fab" onclick="editor()" aria-label="Add task">+</button><nav id="nav"></nav><div id="modal"></div><div id="toast"></div><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), date=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')},today=()=>date(),addDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return date(d)},colors=['#cf5147','#57927c','#678ac7','#b087c0','#d99a45'];
let state={version:1,tasks:[],projects:[{id:'inbox',name:'Inbox',color:colors[2],sections:['General']},{id:'work',name:'Work & Research',color:colors[1],sections:['Backlog','In Progress','Review']},{id:'personal',name:'Personal',color:colors[4],sections:['General']}],dark:false,goal:5},view='today',project='inbox',label='',query='',sort='priority',board=false,edit=null,draft=null,undoTimer,dateTouched=false;
try{const raw=window.Native?Native.load():localStorage.getItem('taskflow');if(raw)state=validate(JSON.parse(raw));}catch(e){setTimeout(()=>notice('Saved data could not be loaded. Restore a backup if needed.'),300)}
function validate(s){if(!s||s.version!==1||!Array.isArray(s.tasks)||!Array.isArray(s.projects)||!s.projects.some(p=>p.id==='inbox')||s.projects.length>500||s.tasks.length>50000)throw Error();const ids=new Set();s.projects.forEach(p=>{if(typeof p.id!=='string'||!/^[-a-zA-Z0-9_]+$/.test(p.id)||ids.has(p.id)||typeof p.name!=='string'||!Array.isArray(p.sections)||!p.sections.length||!p.sections.every(x=>typeof x==='string')||!/^#[0-9a-f]{6}$/i.test(p.color))throw Error();ids.add(p.id)});const tids=new Set();s.tasks.forEach(t=>{if(typeof t.id!=='string'||!/^[-a-zA-Z0-9_]+$/.test(t.id)||tids.has(t.id)||typeof t.title!=='string'||typeof t.description!=='string'||!ids.has(t.projectId)||typeof t.section!=='string'||![1,2,3,4].includes(t.priority)||typeof t.completed!=='boolean'||typeof t.due!=='string'||(t.due&&!/^\d{4}-\d{2}-\d{2}$/.test(t.due))||!Array.isArray(t.labels)||!t.labels.every(x=>typeof x==='string')||!Array.isArray(t.subtasks)||!t.subtasks.every(x=>typeof x.title==='string'&&typeof x.done==='boolean')||!Array.isArray(t.comments)||!t.comments.every(x=>typeof x.text==='string'&&typeof x.at==='string'))throw Error();tids.add(t.id)});s.goal=Math.max(1,Math.min(100,Number(s.goal)||5));s.dark=!!s.dark;return s}
function persist(){const raw=JSON.stringify(state);try{if(window.Native){if(!Native.save(raw))throw Error()}else localStorage.setItem('taskflow',raw);return true}catch(e){notice('Could not save changes. Please export a backup.');return false}}
function proj(id){return state.projects.find(p=>p.id===id)||state.projects[0]}function completedToday(){return state.tasks.filter(t=>t.completed&&t.completedAt?.slice(0,10)===today()).length}
function filtered(){let ts=state.tasks.filter(t=>view==='completed'?t.completed:!t.completed);if(view==='today')ts=ts.filter(t=>t.due&&t.due<=today());if(view==='upcoming')ts=ts.filter(t=>t.due&&t.due>=today());if(view==='inbox')ts=ts.filter(t=>t.projectId==='inbox');if(view==='project')ts=ts.filter(t=>t.projectId===project);if(view==='label')ts=ts.filter(t=>t.labels.includes(label));if(view==='urgent')ts=ts.filter(t=>t.priority===1);if(view==='search'){const q=query.toLowerCase().trim();ts=ts.filter(t=>q==='overdue'?t.due&&t.due<today():/^p[1-4]$/.test(q)?t.priority===+q[1]:q.startsWith('@')?t.labels.some(l=>l.toLowerCase()===q.slice(1)):q.startsWith('#')?proj(t.projectId).name.toLowerCase().includes(q.slice(1)):(t.title+' '+t.description+' '+t.labels.join(' ')).toLowerCase().includes(q))}return ts.sort((a,b)=>sort==='date'?(a.due||'9999').localeCompare(b.due||'9999')||a.priority-b.priority:sort==='name'?a.title.localeCompare(b.title):a.priority-b.priority||(a.due||'9999').localeCompare(b.due||'9999'))}
function title(){return ({today:'Today',upcoming:'Upcoming',inbox:'Inbox',completed:'Completed',search:'Search',urgent:'Priority 1',all:'All tasks',label:'@'+label,project:proj(project).name})[view]||'Browse'}
function go(v,p){view=v;if(p)project=p;query='';closeModal();render()}
function render(){document.body.classList.toggle('dark',state.dark);const ts=filtered(),done=completedToday();$('app').innerHTML=`<div class="hero"><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${esc(title())}</h1><div class="muted small">${ts.length} ${ts.length===1?'task':'tasks'}${view==='today'?' · A little focus goes a long way.':''}</div>${view==='today'?`<div class="progress"><span style="width:${Math.min(100,done/state.goal*100)}%"></span></div><p class="small muted">${done} of ${state.goal} tasks completed today${done>=state.goal?' · Goal achieved ✓':''}</p>`:''}</div>${view==='search'?`<div class="search"><input id="searchbox" placeholder="Search tasks, @label, #project, p1, overdue" value="${esc(query)}" oninput="query=this.value;renderResults()" aria-label="Search tasks"></div>`:''}<div class="toolbar"><button class="chip ${!board?'on':''}" onclick="board=false;render()">☰ List</button><button class="chip ${board?'on':''}" onclick="board=true;render()">▥ Board</button><select class="chip" style="width:auto" aria-label="Sort tasks" onchange="sort=this.value;render()"><option value="priority" ${sort==='priority'?'selected':''}>Priority</option><option value="date" ${sort==='date'?'selected':''}>Due date</option><option value="name" ${sort==='name'?'selected':''}>Name</option></select>${view==='project'?'<button class="chip" onclick="projectEditor(project)">Edit project</button>':''}</div><main id="results"></main>`;renderResults();$('nav').innerHTML=[['inbox','▣','Inbox'],['today','☀','Today'],['upcoming','▦','Upcoming'],['browse','☷','Browse']].map(([v,i,n])=>`<button class="${view===v||(v==='browse'&&['project','label','all','completed','urgent'].includes(view))?'active':''}" onclick="${v==='browse'?'browse()':`go('${v}')`}"><b>${i}</b>${n}</button>`).join('')}
function renderResults(){const ts=filtered();if(!ts.length){$('results').innerHTML='<div class="empty"><div class="big">✓</div><h3>A little breathing room</h3><p class="muted small">No tasks here. Tap + to add your next step.</p></div>';return}let groups={};if(board){const sections=view==='project'?proj(project).sections:['Priority 1','Priority 2','Priority 3','Priority 4'];sections.forEach(s=>groups[s]=[]);ts.forEach(t=>{let key=view==='project'?t.section:'Priority '+t.priority;(groups[key]??=[]).push(t)});$('results').innerHTML='<div class="board">'+Object.entries(groups).map(([s,t])=>`<div class="column"><h3>${esc(s)} <span class="muted small">${t.length}</span></h3>${t.map(taskHTML).join('')||'<p class="muted small">Nothing here yet</p>'}</div>`).join('')+'</div>'}else{ts.forEach(t=>{let key=view==='project'?t.section:view==='today'?(t.due<today()?'Overdue':'Today'):view==='upcoming'?(t.due===today()?'Today':t.due):'Tasks';(groups[key]??=[]).push(t)});if(view==='upcoming')groups=Object.fromEntries(Object.entries(groups).sort((a,b)=>(a[0]==='Today'?'0000':a[0]).localeCompare(b[0]==='Today'?'0000':b[0])));$('results').innerHTML=Object.entries(groups).map(([s,t])=>`<section class="group"><h3>${esc(s)} <span class="muted">${t.length}</span></h3>${t.map(taskHTML).join('')}</section>`).join('')}}
function taskHTML(t){const c=['','#cf5147','#db973e','#678ac7','#aaa'][t.priority];return `<article class="task"><button class="check ${t.completed?'done':''}" style="border-color:${c}" aria-label="${t.completed?'Reopen':'Complete'} task" onclick="toggle('${t.id}')">${t.completed?'✓':''}</button><div class="taskbody" role="button" tabindex="0" onclick="editor('${t.id}')" onkeydown="if(event.key==='Enter')editor('${t.id}')"><div class="title ${t.completed?'completed':''}">${esc(t.title)}</div>${t.description?`<div class="small muted" style="margin-top:4px">${esc(t.description.slice(0,85))}</div>`:''}<div class="meta">${t.due?`<span class="${!t.completed&&t.due<today()?'overdue':''}">▦ ${t.due===today()?'Today':t.due===addDays(1)?'Tomorrow':esc(t.due)}</span>`:''}<span style="color:${proj(t.projectId).color}"># ${esc(proj(t.projectId).name)}</span>${t.subtasks.length?`<span>☑ ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</span>`:''}${t.labels.map(l=>`<span class="tag">@${esc(l)}</span>`).join('')}${t.comments.length?'<span>◌ '+t.comments.length+'</span>':''}</div></div></article>`}
function toggle(id){const t=state.tasks.find(t=>t.id===id);t.completed=!t.completed;t.completedAt=t.completed?today():'';persist();render();notice(t.completed?'Task completed':'Task reopened',()=>toggle(id))}
function notice(text,undo){clearTimeout(undoTimer);$('toast').innerHTML='<div class="notice">'+esc(text)+(undo?'<button id="undo">Undo</button>':'')+'</div>';if(undo)$('undo').onclick=()=>{$('toast').innerHTML='';undo()};undoTimer=setTimeout(()=>$('toast').innerHTML='',5000)}
function modal(content){$('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="sheet">'+content+'</section></div>'}function closeModal(){$('modal').innerHTML='';draft=null}function head(t){return '<div class="sheethead"><h2>'+esc(t)+'</h2><button class="icon" onclick="closeModal()" aria-label="Close">×</button></div>'}
function editor(id){dateTouched=false;edit=id||null;const found=state.tasks.find(t=>t.id===id);draft=found?JSON.parse(JSON.stringify(found)):{id:uid(),title:'',description:'',projectId:view==='project'?project:'inbox',section:view==='project'?proj(project).sections[0]:'General',priority:4,due:view==='today'?today():'',labels:[],subtasks:[],comments:[],completed:false};modal(head(id?'Task details':'Add a task')+`<form onsubmit="event.preventDefault();saveTask()"><input id="etitle" placeholder="What needs to be done?" aria-label="Task title" maxlength="500" required value="${esc(draft.title)}"><p class="help">Quick entry: tomorrow p1 @reading #work</p><label class="field" for="edesc">Description</label><textarea id="edesc" placeholder="Notes, links, or a little context">${esc(draft.description)}</textarea><div class="row"><div><label class="field" for="edue">Due date</label><input type="date" id="edue" onchange="dateTouched=true" value="${esc(draft.due)}"></div><div><label class="field" for="epriority">Priority</label><select id="epriority">${[1,2,3,4].map(n=>`<option value="${n}" ${draft.priority===n?'selected':''}>P${n} · ${['','Urgent','High','Medium','Normal'][n]}</option>`).join('')}</select></div></div><div class="row"><div><label class="field" for="eproject">Project</label><select id="eproject" onchange="updateSections()">${state.projects.map(p=>`<option value="${p.id}" ${draft.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label class="field" for="esection">Section</label><select id="esection"></select></div></div><label class="field" for="elabels">Labels (comma separated)</label><input id="elabels" placeholder="reading, deepwork" value="${esc(draft.labels.join(', '))}"><label class="field">Subtasks</label><div id="subtasks"></div><div class="row"><input id="newsub" placeholder="Add a small step" onkeydown="if(event.key==='Enter'){event.preventDefault();addSub()}"><button type="button" onclick="addSub()" style="flex:0">+</button></div><label class="field">Activity & comments</label><div id="comments"></div><div class="row"><input id="newcomment" placeholder="Write a comment" onkeydown="if(event.key==='Enter'){event.preventDefault();addComment()}"><button type="button" onclick="addComment()" style="flex:0">+</button></div><button class="primary wide" type="submit">${id?'Save changes':'Add task'}</button>${id?`<button type="button" class="danger wide" onclick="deleteTask('${id}')">Delete task</button>`:''}</form>`);updateSections(draft.section);renderSubs();renderComments()}
function updateSections(selected){$('esection').innerHTML=proj($('eproject').value).sections.map(s=>`<option ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function renderSubs(){$('subtasks').innerHTML=draft.subtasks.map((s,i)=>`<div class="subrow"><input type="checkbox" aria-label="Complete subtask" ${s.done?'checked':''} onchange="draft.subtasks[${i}].done=this.checked"><span>${esc(s.title)}</span><button type="button" aria-label="Remove subtask" onclick="draft.subtasks.splice(${i},1);renderSubs()">×</button></div>`).join('')}
function addSub(){const s=$('newsub').value.trim();if(s){draft.subtasks.push({title:s,done:false});$('newsub').value='';renderSubs()}}
function renderComments(){$('comments').innerHTML=draft.comments.map(c=>`<div class="comment">${esc(c.text)}<time>${esc(new Date(c.at).toLocaleString())}</time></div>`).join('')}
function addComment(){const s=$('newcomment').value.trim();if(s){draft.comments.push({text:s,at:new Date().toISOString()});$('newcomment').value='';renderComments()}}
function saveTask(){let text=$('etitle').value.trim();if(!text)return;draft.description=$('edesc').value.trim();draft.due=$('edue').value;draft.priority=+$('epriority').value;draft.projectId=$('eproject').value;draft.section=$('esection').value;draft.labels=$('elabels').value.split(',').map(x=>x.trim().replace(/^@/, '').toLowerCase()).filter(Boolean);if(!edit){text=text.replace(/\bp([1-4])\b/i,(_,n)=>{draft.priority=+n;return ''}).replace(/@([\p{L}\p{N}_-]+)/gu,(_,l)=>{draft.labels.push(l.toLowerCase());return ''}).replace(/#([\p{L}\p{N}_-]+)/gu,(m,k)=>{const p=state.projects.find(p=>p.id.toLowerCase()===k.toLowerCase()||p.name.toLowerCase().replace(/\s+/g,'-')===k.toLowerCase());if(!p)return m;draft.projectId=p.id;draft.section=p.sections[0];return ''});if(!dateTouched)text=text.replace(/\b(today|tomorrow|next week)\b/i,(_,v)=>{draft.due=v.toLowerCase()==='today'?today():addDays(v.toLowerCase()==='tomorrow'?1:7);return ''})}draft.title=text.replace(/\s+/g,' ').trim();if(!draft.title){notice('Please include a task title.');return}draft.labels=[...new Set(draft.labels)];addSub();addComment();const i=state.tasks.findIndex(t=>t.id===edit);if(i>=0)state.tasks[i]=draft;else state.tasks.push(draft);persist();closeModal();render()}
function deleteTask(id){const t=state.tasks.find(t=>t.id===id);state.tasks=state.tasks.filter(t=>t.id!==id);persist();closeModal();render();notice('Task deleted',()=>{state.tasks.push(t);persist();render()})}
function browse(){const labels=[...new Set(state.tasks.flatMap(t=>t.labels))].sort();modal(head('Your workspace')+`<button class="listbutton" onclick="go('all')">☷ <span>All tasks</span><span class="muted">${state.tasks.filter(t=>!t.completed).length}</span></button><button class="listbutton" onclick="go('urgent')">⚑ <span>Priority 1</span></button><button class="listbutton" onclick="go('completed')">✓ <span>Completed archive</span></button><div class="row sectionname"><strong>PROJECTS</strong><button onclick="projectEditor()" style="flex:0">+ New</button></div>${state.projects.filter(p=>p.id!=='inbox').map(p=>`<button class="listbutton" onclick="go('project','${p.id}')"><i class="dot" style="background:${p.color}"></i><span>${esc(p.name)}</span><span class="muted">${state.tasks.filter(t=>t.projectId===p.id&&!t.completed).length}</span></button>`).join('')}<p class="sectionname"><strong>LABELS</strong></p>${labels.map((l,i)=>`<button class="listbutton" data-label="${esc(l)}" onclick="label=this.dataset.label;go('label')">＠ <span>${esc(l)}</span></button>`).join('')||'<p class="help">Add labels when creating a task.</p>'}`)}
function projectEditor(id){const p=id?proj(id):{name:'',color:colors[1],sections:['General']};modal(head(id?'Edit project':'New project')+`<form onsubmit="event.preventDefault();saveProject('${id||''}')"><label class="field">Project name</label><input id="pname" required maxlength="100" value="${esc(p.name)}"><label class="field">Color</label><input type="color" id="pcolor" value="${p.color}" style="height:50px"><label class="field">Sections (one per line)</label><textarea id="psections">${esc(p.sections.join('\n'))}</textarea><p class="help">Tasks in removed sections move to the first section.</p><button class="primary wide">Save project</button>${id&&id!=='inbox'?`<button type="button" class="danger wide" onclick="removeProject('${id}')">Delete project…</button>`:''}</form>`)}
function saveProject(id){const name=$('pname').value.trim();if(!name)return;const sections=[...new Set($('psections').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!sections.length)sections.push('General');const p={id:id||uid(),name,color:$('pcolor').value,sections};if(id){state.projects[state.projects.findIndex(p=>p.id===id)]=p;state.tasks.filter(t=>t.projectId===id&&!sections.includes(t.section)).forEach(t=>t.section=sections[0])}else state.projects.push(p);persist();go('project',p.id)}
function removeProject(id){modal(head('Delete project?')+'<p>Its tasks will move to Inbox, including completed tasks.</p><button class="primary wide" onclick="confirmRemoveProject(\''+id+'\')">Delete project & move tasks</button>')}
function confirmRemoveProject(id){state.tasks.filter(t=>t.projectId===id).forEach(t=>{t.projectId='inbox';t.section='General'});state.projects=state.projects.filter(p=>p.id!==id);persist();go('inbox')}
function searchView(){go('search');$('searchbox').focus()}
function settings(){const count=state.tasks.filter(t=>t.completed).length;modal(head('Make space for what matters')+`<div class="row"><div class="stat"><strong>${completedToday()}</strong><span class="small muted">done today</span></div><div class="stat"><strong>${count}</strong><span class="small muted">completed total</span></div></div><label class="field">Daily goal</label><input type="number" min="1" max="100" id="goal" value="${state.goal}" onchange="state.goal=Math.max(1,Math.min(100,parseInt(this.value)||5));persist();render()"><button class="listbutton" onclick="state.dark=!state.dark;persist();render();settings()">◐ <span>Dark theme</span><span>${state.dark?'On':'Off'}</span></button><button class="listbutton" onclick="exportBackup()">↗ <span>Export backup</span></button><button class="listbutton" onclick="importBackup()">↙ <span>Restore backup…</span></button><p class="help">TaskFlow 1.0 · Independent task manager inspired by familiar productivity workflows.<br><br>Your tasks are stored on this device. Export a backup before uninstalling or changing phones.<br><br>Includes projects, sections, labels, priorities, due dates, subtasks, comments, board view, and search. No account required. Cloud sync, shared projects, recurring tasks, and reminders are not included in this version.</p>`)}
function exportBackup(){const s=JSON.stringify(state,null,2);if(window.Native)Native.exportData(s);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='TaskFlow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function importBackup(){modal(head('Restore a backup?')+'<p>Restoring replaces the tasks and projects currently on this device. Export your current data first if you want to keep it.</p><button class="primary wide" onclick="pickBackup()">Choose backup file</button>')}
function pickBackup(){if(window.Native)Native.importData();else{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{if(i.files[0])restoreBackup(await i.files[0].text())};i.click()}}
window.restoreBackup=function(raw){try{const next=validate(JSON.parse(raw));const previous=state;state=next;if(!persist()){state=previous;return}go('today');notice('Backup restored')}catch(e){notice('Invalid backup. Existing tasks were kept.')}};
window.handleBack=function(){if($('modal').innerHTML){closeModal();return true}if(view!=='today'){go('today');return true}return false};render();
</script></body></html>
