name: taskflow_server
description: The TaskFlow sync server. One small Dart program on SQLite that keeps each person's data separate and merges edits from their devices.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.5.0
  crypto: ^3.0.3
  http: ^1.2.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  sqlite3: ^3.0.0
  taskflow_core:
    path: ../packages/taskflow_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
